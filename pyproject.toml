[project]
name = "gecx-mcp-a2a-vpcsc"
version = "0.2.0"
description = "Reference implementation and verification testbed for CX Agent Studio (GECX) MCP regional failover and A2A connectivity under VPC Service Controls"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8.0,<2.0.0",
    "starlette>=0.40.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<10.0.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
